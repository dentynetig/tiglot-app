<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบคีย์หวยTigkakit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ซ่อนลูกศรเพิ่ม-ลดราคาในช่อง input number */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 flex items-center justify-center min-h-screen p-2 sm:p-4 font-sans">

  <div class="bg-white border border-slate-200 rounded-3xl p-4 sm:p-6 w-full max-w-lg shadow-2xl space-y-4" id="captureArea">
    
    <!-- Header & เมนูเลือกหวย + นับถอยหลัง (ย้ายมาไว้จุดนี้) -->
    <div class="bg-slate-800 p-3.5 rounded-2xl border border-slate-700 text-white shadow-md space-y-3">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-2.5">
        <div class="w-full sm:w-auto">
          <label class="text-[11px] text-slate-400 block mb-1">เลือกประเภทหวย</label>
          <select id="lottoType" onchange="updateLottoConfig()" class="w-full font-bold text-slate-900 bg-amber-400 border border-amber-300 rounded-xl px-3 py-1.5 text-xs sm:text-sm outline-none shadow-sm cursor-pointer focus:ring-2 focus:ring-amber-300">
            <option value="TH">หวยไทย (ปิด 15:20)</option>
            <option value="LAO">หวยลาว (ปิด 20:20)</option>
            <option value="LAO_STAR">หวยลาวสตาร์ (ปิด 15:30)</option>
            <option value="HANOI_SPECIAL">หวยฮานอยพิเศษ (ปิด 17:00)</option>
            <option value="HANOI_NORMAL">หวยฮานอยปกติ (ปิด 18:00)</option>
            <option value="HANOI_VIP">หวยฮานอย VIP (ปิด 19:00)</option>
          </select>
        </div>
        <div class="w-full sm:w-auto">
          <label class="text-[11px] text-slate-400 block mb-1">ประจำวันที่</label>
          <input type="date" id="lottoDate" onchange="updateLottoConfig()" class="w-full text-xs sm:text-sm border border-slate-600 rounded-xl p-1.5 font-semibold text-white bg-slate-700 shadow-sm outline-none focus:border-amber-400">
        </div>
      </div>

      <!-- แถบแสดงเวลานับถอยหลังใหม่ที่ Header -->
      <div class="flex items-center justify-between bg-slate-900/80 px-3 py-2 rounded-xl border border-slate-700/60 text-xs">
        <span class="text-slate-400 font-medium">⏳ สถานะการปิดรับ:</span>
        <span id="countdown" class="font-bold text-red-400 bg-slate-800 px-2.5 py-0.5 rounded-md border border-slate-700">00:00:00</span>
      </div>
    </div>

    <!-- 1. ปุ่มเลือกประเภทเลข + ปุ่มจ่ายครึ่ง -->
    <div class="grid grid-cols-4 sm:grid-cols-4 gap-1.5 items-center">
      <button onclick="setType('2d')" id="btn-2d" class="type-btn py-2 font-bold rounded-xl bg-amber-400 border-2 border-slate-800 text-slate-900 shadow text-xs">2 ตัว</button>
      <button onclick="setType('2rot')" id="btn-2rot" class="type-btn py-2 font-bold rounded-xl bg-slate-100 border-2 border-transparent text-slate-600 text-xs">2 กลับ</button>
      <button onclick="setType('3d')" id="btn-3d" class="type-btn py-2 font-bold rounded-xl bg-slate-100 border-2 border-transparent text-slate-600 text-xs">3 ตัว</button>
      <button onclick="setType('3d_bottom')" id="btn-3d_bottom" class="type-btn py-2 font-bold rounded-xl bg-slate-100 border-2 border-transparent text-slate-600 text-xs">3 ล่าง</button>
      <button onclick="setType('6rot')" id="btn-6rot" class="type-btn py-2 font-bold rounded-xl bg-slate-100 border-2 border-transparent text-slate-600 text-xs">6 กลับ</button>
      <button onclick="setType('wing')" id="btn-wing" class="type-btn py-2 font-bold rounded-xl bg-slate-100 border-2 border-transparent text-slate-600 text-xs">วิ่ง</button>
      <button onclick="setType('rood')" id="btn-rood" class="type-btn py-2 font-bold rounded-xl bg-slate-100 border-2 border-transparent text-slate-600 text-xs">19 ประตู</button>
      
      <!-- ปุ่มจ่ายครึ่ง -->
      <button onclick="toggleHalfPay()" id="btn-half" class="py-2 font-bold rounded-xl bg-slate-100 text-slate-600 border-2 border-transparent text-xs transition active:scale-95">
        🏷️ จ่ายครึ่ง
      </button>
    </div>

    <!-- 2. กล่องคีย์ตัวเลขสะสม -->
    <div class="bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl p-3 min-h-[60px] flex flex-wrap gap-1.5 items-center justify-center max-h-36 overflow-y-auto" id="accumulatedBox">
      <span class="text-slate-400 text-xs text-center" id="emptyAccText">คีย์ตัวเลขเพื่อสะสม (กดที่เลขเพื่อลบ)</span>
    </div>

    <!-- 3. ฟอร์มกรอกเลข และ ราคา -->
    <div class="bg-amber-50/60 p-3.5 rounded-2xl border border-amber-200 space-y-3">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <span class="font-bold text-slate-700 text-xs sm:text-sm">ใส่เลข</span>
          <input type="text" id="numInput" placeholder="00" maxlength="2" oninput="handleAutoAdd(this)" class="w-20 text-center font-extrabold text-xl py-1 rounded-xl border-2 border-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-400 bg-white shadow-inner text-slate-900">
        </div>

        <!-- ช่องราคา -->
        <div class="flex items-center gap-1.5">
          <div id="priceTopGroup" class="flex flex-col items-center">
            <span class="text-[10px] font-bold text-slate-500 mb-0.5" id="labelTop">บน</span>
            <input type="number" id="priceTop" placeholder="0" class="w-14 text-center font-bold py-1 rounded-lg border border-slate-300 bg-white text-xs sm:text-sm focus:outline-none focus:border-amber-500">
          </div>
          
          <div id="priceBottomGroup" class="flex items-center gap-1.5">
            <span class="text-xs font-bold text-slate-400 mt-3">x</span>
            <div class="flex flex-col items-center">
              <span class="text-[10px] font-bold text-slate-500 mb-0.5" id="labelBottom">ล่าง</span>
              <input type="number" id="priceBottom" placeholder="0" class="w-14 text-center font-bold py-1 rounded-lg border border-slate-300 bg-white text-xs sm:text-sm focus:outline-none focus:border-amber-500">
            </div>
          </div>

          <div id="priceTodGroup" class="flex items-center gap-1.5">
            <span class="text-xs font-bold text-slate-400 mt-3">x</span>
            <div class="flex flex-col items-center">
              <span class="text-[10px] font-bold text-slate-500 mb-0.5">โต๊ด</span>
              <input type="number" id="priceTod" placeholder="0" class="w-14 text-center font-bold py-1 rounded-lg border border-slate-300 bg-white text-xs sm:text-sm focus:outline-none focus:border-amber-500">
            </div>
          </div>
        </div>
      </div>

      <button id="addBillBtn" onclick="addNumbersToBill()" class="w-full bg-slate-900 hover:bg-slate-800 active:scale-95 transition text-amber-400 font-bold py-2.5 rounded-xl shadow-md text-sm border border-slate-700 flex items-center justify-center gap-2">
        ➕ เพิ่มรายการลงบิล
      </button>
    </div>

    <!-- 4. ช่องแสดงรายการในบิล -->
    <div class="bg-slate-50 border border-slate-200 rounded-2xl overflow-hidden divide-y divide-slate-200 max-h-48 overflow-y-auto" id="billBox">
      <div class="text-center text-slate-400 text-xs py-8" id="emptyBillText">ยังไม่มีรายการในบิลนี้</div>
    </div>

    <!-- 5. ส่วนล่าง: หมายเหตุ, สรุปรวม และปุ่มล้างข้อมูล -->
    <div class="space-y-3 pt-1 border-t border-slate-100">
      <div class="flex items-center gap-2">
        <span class="text-xs font-bold text-slate-600 whitespace-nowrap">หมายเหตุ:</span>
        <input type="text" id="noteInput" placeholder="พิมพ์ชื่อลูกค้า/โพย..." class="w-full text-xs font-semibold border border-slate-200 rounded-xl p-2 outline-none bg-slate-50 focus:bg-white focus:border-amber-400 transition">
      </div>

      <!-- สรุปผลยอดรวมอย่างเดียว -->
      <div class="bg-slate-900 text-white p-4 rounded-2xl shadow-inner text-center space-y-1">
        <div class="text-amber-400 font-bold text-xs sm:text-sm tracking-wide" id="lottoHeaderDisplay">[รัฐบาล] หวยไทย</div>
        <div class="text-2xl sm:text-3xl font-black text-white pt-1">
          รวมทั้งสิ้น <span id="totalAmount" class="text-amber-400">0.00</span> บาท
        </div>
      </div>

      <!-- ปุ่มล้างข้อมูล -->
      <div class="flex justify-end">
        <button onclick="clearAll()" class="bg-red-50 hover:bg-red-100 text-red-600 active:scale-95 font-bold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1 border border-red-200 transition">
          🧹 ล้างข้อมูลทั้งหมด
        </button>
      </div>
    </div>

  </div>

  <script>
    let currentType = '2d';
    let isHalfPay = false;
    let numbersList = [];
    let billGroups = [];
    let timerInterval = null;
    let isExpired = false;

    // กำหนดเวลาปิดรับหวยแต่ละประเภท (ชั่วโมง:นาที)
    const LOTTO_CONFIG = {
      'TH': { name: '[รัฐบาล] หวยไทย', hour: 15, minute: 20 },
      'LAO': { name: '[ต่างประเทศ] หวยลาว', hour: 20, minute: 20 },
      'LAO_STAR': { name: '[ต่างประเทศ] หวยลาวสตาร์', hour: 15, minute: 30 },
      'HANOI_SPECIAL': { name: '[ต่างประเทศ] หวยฮานอยพิเศษ', hour: 17, minute: 0 },
      'HANOI_NORMAL': { name: '[ต่างประเทศ] หวยฮานอยปกติ', hour: 18, minute: 0 },
      'HANOI_VIP': { name: '[ต่างประเทศ] หวยฮานอย VIP', hour: 19, minute: 0 }
    };

    document.getElementById('lottoDate').valueAsDate = new Date();

    function setType(type) {
      currentType = type;
      document.querySelectorAll('.type-btn').forEach(btn => {
        btn.classList.remove('bg-amber-400', 'border-slate-800', 'text-slate-900');
        btn.classList.add('bg-slate-100', 'border-transparent', 'text-slate-600');
      });
      
      const activeBtn = document.getElementById(`btn-${type}`);
      activeBtn.classList.add('bg-amber-400', 'border-slate-800', 'text-slate-900');
      activeBtn.classList.remove('bg-slate-100', 'border-transparent', 'text-slate-600');

      const numInput = document.getElementById('numInput');
      const pTop = document.getElementById('priceTopGroup');
      const pBottom = document.getElementById('priceBottomGroup');
      const pTod = document.getElementById('priceTodGroup');
      const labelTop = document.getElementById('labelTop');
      const labelBottom = document.getElementById('labelBottom');

      labelTop.innerText = "บน";
      labelBottom.innerText = "ล่าง";

      if (type === '2d' || type === '2rot') {
        numInput.maxLength = 2;
        numInput.placeholder = "00";
        pTop.style.display = 'flex';
        pBottom.style.display = 'flex';
        pTod.style.display = 'none';
      } else if (type === '3d') {
        numInput.maxLength = 3;
        numInput.placeholder = "000";
        pTop.style.display = 'flex';
        pBottom.style.display = 'none';
        pTod.style.display = 'flex';
      } else if (type === '3d_bottom') {
        numInput.maxLength = 3;
        numInput.placeholder = "000";
        pTop.style.display = 'none';
        pBottom.style.display = 'flex';
        pTod.style.display = 'none';
      } else if (type === '6rot') {
        numInput.maxLength = 3;
        numInput.placeholder = "000";
        pTop.style.display = 'flex';
        pBottom.style.display = 'none';
        pTod.style.display = 'none';
      } else if (type === 'wing') {
        numInput.maxLength = 1;
        numInput.placeholder = "0";
        labelTop.innerText = "วิ่งบน";
        labelBottom.innerText = "วิ่งล่าง";
        pTop.style.display = 'flex';
        pBottom.style.display = 'flex';
        pTod.style.display = 'none';
      } else if (type === 'rood') {
        numInput.maxLength = 1;
        numInput.placeholder = "0";
        pTop.style.display = 'flex';
        pBottom.style.display = 'flex';
        pTod.style.display = 'none';
      }
      numbersList = [];
      renderAccumulated();  
    }

    function toggleHalfPay() {
      isHalfPay = !isHalfPay;
      const btn = document.getElementById('btn-half');
      if (isHalfPay) {
        btn.classList.remove('bg-slate-100', 'text-slate-600', 'border-transparent');
        btn.classList.add('bg-red-500', 'text-white', 'border-red-700', 'shadow-md');
      } else {
        btn.classList.remove('bg-red-500', 'text-white', 'border-red-700', 'shadow-md');
        btn.classList.add('bg-slate-100', 'text-slate-600', 'border-transparent');
      }
    }

    function getPermutations(str) {
      if (str.length <= 1) return [str];
      let permutations = [];
      for (let i = 0; i < str.length; i++) {
        let char = str[i];
        let remaining = str.slice(0, i) + str.slice(i + 1);
        for (let sub of getPermutations(remaining)) {
          permutations.push(char + sub);
        }
      }
      return [...new Set(permutations)];
    }

    function generate2RotNumbers(val) {
      const reversed = val.split('').reverse().join('');
      return [...new Set([val, reversed])];
    }

    function generateRoodNumbers(digit) {
      let result = [];
      for (let i = 0; i <= 9; i++) {
        result.push(`${digit}${i}`);
      }
      for (let i = 0; i <= 9; i++) {
        let num = `${i}${digit}`;
        if (!result.includes(num)) {
          result.push(num);
        }
      }
      return result;
    }

    function addSingleNumber(num) {
      if (isExpired) return;
      if (!numbersList.some(item => item.num === num)) {
        numbersList.push({ num: num, isHalf: isHalfPay });
      }
    }

    function handleAutoAdd(input) {
      if (isExpired) {
        input.value = '';
        return;
      }

      input.value = input.value.replace(/[^0-9]/g, '');
      
      let reqLen = 2;
      if (currentType === '3d' || currentType === '3d_bottom' || currentType === '6rot') {
        reqLen = 3;
      } else if (currentType === 'wing' || currentType === 'rood') {
        reqLen = 1;
      }

      if (input.value.length === reqLen) {
        if (currentType === '2rot') {
          generate2RotNumbers(input.value).forEach(num => addSingleNumber(num));
        } else if (currentType === '6rot') {
          getPermutations(input.value).forEach(num => addSingleNumber(num));
        } else if (currentType === 'rood') {
          generateRoodNumbers(input.value).forEach(num => addSingleNumber(num));
        } else {
          addSingleNumber(input.value);
        }
        input.value = '';
        renderAccumulated();
      }
    }

    function renderAccumulated() {
      const box = document.getElementById('accumulatedBox');
      box.innerHTML = '';

      if (numbersList.length === 0) {
        box.innerHTML = `<span class="text-slate-400 text-xs text-center" id="emptyAccText">คีย์ตัวเลขเพื่อสะสม (กดที่เลขเพื่อลบ)</span>`;
        return;
      }

      numbersList.forEach((item, index) => {
        const tag = document.createElement('div');
        const bgClass = item.isHalf 
          ? 'bg-red-100 border-red-300 text-red-600' 
          : 'bg-emerald-100 border-emerald-300 text-emerald-800';

        tag.className = `${bgClass} border font-black px-2.5 py-0.5 rounded-lg cursor-pointer text-xs flex items-center gap-1 shadow-sm hover:opacity-80 transition`;
        tag.title = 'คลิกเพื่อลบเลขนี้';
        tag.innerHTML = `<span>${item.num}</span><span class="text-[10px] opacity-60">✕</span>`;
        
        tag.onclick = () => {
          numbersList.splice(index, 1);
          renderAccumulated();
        };
        box.appendChild(tag);
      });
    }

    function addNumbersToBill() {
      if (isExpired) {
        alert("หวยประเภทนี้ปิดรับแทงสำหรับวันที่เลือกแล้ว ไม่สามารถเพิ่มบิลได้");
        return;
      }

      const singleInput = document.getElementById('numInput');
      let reqLen = (currentType === '3d' || currentType === '3d_bottom' || currentType === '6rot') ? 3 : 
                   (currentType === 'wing' || currentType === 'rood') ? 1 : 2;

      if (singleInput.value.length === reqLen) {
        if (currentType === '2rot') {
          generate2RotNumbers(singleInput.value).forEach(num => addSingleNumber(num));
        } else if (currentType === '6rot') {
          getPermutations(singleInput.value).forEach(num => addSingleNumber(num));
        } else if (currentType === 'rood') {
          generateRoodNumbers(singleInput.value).forEach(num => addSingleNumber(num));
        } else {
          addSingleNumber(singleInput.value);
        }
        singleInput.value = '';
      }

      if (numbersList.length === 0) {
        alert("กรุณากรอกตัวเลขอย่างน้อย 1 ชุดก่อนเพิ่มบิล");
        return;
      }

      const topVal = parseFloat(document.getElementById('priceTop').value) || 0;
      const bottomVal = parseFloat(document.getElementById('priceBottom').value) || 0;
      const todVal = parseFloat(document.getElementById('priceTod').value) || 0;

      let typeTitle = '';
      let labelFormat = 'บน x ล่าง';
      let priceFormat = '';
      let multiplier = 0;

      if (currentType === '2d') {
        typeTitle = '2 ตัว';
        priceFormat = `${topVal} x ${bottomVal}`;
        multiplier = topVal + bottomVal;
      } else if (currentType === '2rot') {
        typeTitle = '2 กลับ';
        priceFormat = `${topVal} x ${bottomVal}`;
        multiplier = topVal + bottomVal;
      } else if (currentType === '3d') {
        typeTitle = '3 ตัว';
        priceFormat = `${topVal} x ${todVal}`;
        multiplier = topVal + todVal;
      } else if (currentType === '3d_bottom') {
        typeTitle = '3 ตัว';
        priceFormat = `0 x ${bottomVal}`;
        multiplier = bottomVal;
      } else if (currentType === '6rot') {
        typeTitle = '6 กลับ';
        priceFormat = `${topVal} x 0`;
        multiplier = topVal;
      } else if (currentType === 'wing') {
        typeTitle = 'วิ่ง';
        labelFormat = 'วิ่งบน x วิ่งล่าง';
        priceFormat = `${topVal} x ${bottomVal}`;
        multiplier = topVal + bottomVal;
      } else if (currentType === 'rood') {
        typeTitle = 'รูด';
        priceFormat = `${topVal} x ${bottomVal}`;
        multiplier = topVal + bottomVal;
      }

      if (multiplier === 0) {
        alert("กรุณากรอกราคาอย่างน้อย 1 ช่อง");
        return;
      }

      const totalGroupPrice = numbersList.length * multiplier;

      billGroups.push({
        typeTitle: typeTitle,
        labelFormat: labelFormat,
        priceFormat: priceFormat,
        totalPrice: totalGroupPrice,
        numbers: JSON.parse(JSON.stringify(numbersList))
      });

      numbersList = [];
      document.getElementById('numInput').value = '';
      document.getElementById('priceTop').value = '';
      document.getElementById('priceBottom').value = '';
      document.getElementById('priceTod').value = '';

      renderAccumulated();
      renderBill();
    }

    function renderBill() {
      const billBox = document.getElementById('billBox');
      billBox.innerHTML = '';

      if (billGroups.length === 0) {
        billBox.innerHTML = `<div class="text-center text-slate-400 text-xs py-8" id="emptyBillText">ยังไม่มีรายการในบิลนี้</div>`;
        document.getElementById('totalAmount').innerText = '0.00';
        return;
      }

      let grandTotal = 0;

      billGroups.forEach((group, idx) => {
        grandTotal += group.totalPrice;

        const row = document.createElement('div');
        row.className = 'grid grid-cols-12 items-center bg-white p-2 text-xs';
        
        row.innerHTML = `
          <div class="col-span-4 bg-slate-100 p-2 text-center rounded-xl border border-slate-200">
            <div class="text-slate-800 font-bold">${group.typeTitle}</div>
            <div class="text-[10px] text-slate-500">${group.labelFormat}</div>
            <div class="text-amber-600 font-black mt-0.5">${group.priceFormat}</div>
          </div>

          <div class="col-span-7 px-3 font-extrabold text-slate-800 text-sm flex flex-wrap gap-1.5 items-center max-h-24 overflow-y-auto">
            ${group.numbers.map(item => `
              <span class="${item.isHalf ? 'text-red-500 font-black' : ''}">
                ${item.num}
              </span>
            `).join('')}
          </div>

          <div class="col-span-1 text-center">
            <button onclick="removeGroup(${idx})" class="text-red-400 hover:text-red-600 p-1" title="ลบรายการนี้">
              ✕
            </button>
          </div>
        `;

        billBox.appendChild(row);
      });

      document.getElementById('totalAmount').innerText = grandTotal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function removeGroup(index) {
      billGroups.splice(index, 1);
      renderBill();
    }

    function clearAll() {
      numbersList = [];
      billGroups = [];
      document.getElementById('numInput').value = '';
      document.getElementById('priceTop').value = '';
      document.getElementById('priceBottom').value = '';
      document.getElementById('priceTod').value = '';
      document.getElementById('noteInput').value = '';
      renderAccumulated();
      renderBill();
    }

    function updateLottoConfig() {
      if (timerInterval) clearInterval(timerInterval);

      const lottoKey = document.getElementById('lottoType').value;
      const dateVal = document.getElementById('lottoDate').value;
      const addBillBtn = document.getElementById('addBillBtn');
      const numInput = document.getElementById('numInput');

      if (!dateVal) return;

      const lottoInfo = LOTTO_CONFIG[lottoKey];
      const [year, month, day] = dateVal.split('-').map(Number);
      
      const formattedDate = `${String(day).padStart(2, '0')}-${String(month).padStart(2, '0')}-${year}`;
      document.getElementById('lottoHeaderDisplay').innerText = `${lottoInfo.name} - ${formattedDate}`;

      const targetTime = new Date(year, month - 1, day, lottoInfo.hour, lottoInfo.minute, 0).getTime();

      timerInterval = setInterval(() => {
        const now = new Date().getTime();
        const diff = targetTime - now;

        if (diff <= 0) {
          clearInterval(timerInterval);
          document.getElementById('countdown').innerText = "ปิดรับแทงแล้ว";
          isExpired = true;

          // ระงับการใช้งานปุ่มและช่องกรอกถ้าหมดเวลา
          addBillBtn.disabled = true;
          addBillBtn.classList.remove('bg-slate-900', 'hover:bg-slate-800', 'text-amber-400');
          addBillBtn.classList.add('bg-slate-300', 'text-slate-500', 'cursor-not-allowed');
          numInput.disabled = true;
          numInput.placeholder = "ปิด";
          return;
        }

        // กรณีเวลาปลดล็อก (ยังไม่ปิดรับ)
        isExpired = false;
        addBillBtn.disabled = false;
        addBillBtn.classList.remove('bg-slate-300', 'text-slate-500', 'cursor-not-allowed');
        addBillBtn.classList.add('bg-slate-900', 'hover:bg-slate-800', 'text-amber-400');
        numInput.disabled = false;

        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
        const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((diff % (1000 * 60)) / 1000);

        const timeString = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

        if (d > 0) {
          document.getElementById('countdown').innerText = `${d} วัน ${timeString}`;
        } else {
          document.getElementById('countdown').innerText = timeString;
        }
      }, 1000);
    }

    setType('2d');
    updateLottoConfig();
  </script>
</body>
</html>
